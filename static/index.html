<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackNet Command Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            margin: 0; padding: 0;
        }
        
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .glass-panel {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }

        .status-pulse-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); animation: pulseRed 2s infinite; border-color: rgba(239, 68, 68, 0.6); }
        .status-paused { opacity: 0.35; filter: grayscale(100%); border-color: rgba(255, 255, 255, 0.1); }
        
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .dial {
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .dial::before {
            content: ''; position: absolute; inset: 5px; background: rgba(12, 12, 12, 1); border-radius: 50%;
        }
        
        .text-neon-green { color: #39ff14; }
        .text-neon-purple { color: #b026ff; }
        .border-neon-green { border-color: #39ff14; }
    </style>
</head>
<body class="text-zinc-200">

    <div class="fixed inset-0 z-0 bg-[url('/static/boot_logo.jpeg')] bg-cover bg-center bg-no-repeat opacity-40"></div>
    <div class="fixed inset-0 z-0 bg-black/75 backdrop-blur-md"></div> 

    <!-- RESPONSIVE WRAPPER -->
    <div id="noc-wrapper" class="relative z-10 p-4 md:p-8 flex flex-col" x-data="nocApp()" x-init="initApp()" x-cloak>
        
        <!-- HEADER -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 shrink-0 border-b border-zinc-800/80 pb-4 gap-4">
            <div>
                <h1 class="text-4xl md:text-5xl font-black text-white tracking-tighter drop-shadow-lg flex items-center gap-4">
                    HACKNET <span class="text-neon-green">NOC</span>
                    <span class="text-xs md:text-sm font-mono text-zinc-500 font-bold tracking-widest border border-zinc-700 bg-black px-3 py-1 rounded shadow-inner hidden sm:inline-block">V_2.7.ENT</span>
                </h1>
                <div class="flex items-center gap-2 md:gap-4 mt-2 md:mt-3 text-xs md:text-sm font-mono text-zinc-400 font-bold uppercase tracking-widest">
                    <span class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-neon-green animate-pulse" x-show="!isMuted"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]" x-show="isMuted"></div>
                        <span class="text-white" x-text="isMuted ? 'MUTED' : 'SYSTEM LIVE'"></span>
                    </span>
                    <span class="text-zinc-700">//</span>
                    <span class="text-white" x-text="'TIME: ' + sysTime"></span>
                </div>
            </div>
            <a href="/admin" class="px-5 py-2.5 bg-black border border-zinc-800 hover:border-neon-green text-zinc-400 hover:text-neon-green rounded text-xs font-black uppercase tracking-widest transition-all shadow-lg flex items-center gap-2 z-20">
                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Admin Console
            </a>
        </header>

        <!-- GLOBAL HEALTH RIBBON -->
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 mb-6 shrink-0 xl:h-[140px]">
            
            <div class="xl:col-span-3 glass-panel rounded-xl p-5 flex flex-col relative overflow-hidden min-h-[120px]" :class="wanStatus === 'stopped' ? 'status-pulse-red bg-red-950/40' : ''">
                <div class="flex justify-between items-start z-10">
                    <div>
                        <h2 class="text-xs font-black text-zinc-500 tracking-widest uppercase">WAN Routing</h2>
                        <div class="text-3xl font-black font-mono mt-1 drop-shadow-md" :class="wanStatus === 'stopped' ? 'text-red-500' : 'text-neon-green'" x-text="wanStatus === 'stopped' ? 'OFFLINE' : wanPing + ' ms'"></div>
                    </div>
                </div>
                <div class="flex-1 relative w-full -mb-3 -ml-3 -mr-3 mt-1 min-h-[50px]">
                    <canvas id="wanChart"></canvas>
                </div>
            </div>

            <div class="xl:col-span-6 glass-panel rounded-xl p-5 flex flex-row justify-between items-center relative overflow-hidden min-h-[120px]" :class="hostStatus === 'stopped' ? 'status-pulse-red' : 'border-t border-t-zinc-700'">
                <div class="flex flex-col justify-between h-full">
                    <div>
                        <h2 class="text-xs font-black text-zinc-500 tracking-widest uppercase mb-1">Hypervisor Core</h2>
                        <div class="text-xl md:text-2xl font-black text-white uppercase tracking-wider drop-shadow">CORE-PVE</div>
                    </div>
                    <div class="mt-auto pt-2">
                        <span class="text-[10px] font-mono font-black tracking-widest uppercase px-2 py-0.5 rounded border"
                              :class="hostStatus === 'running' ? 'bg-[#39ff14]/10 text-neon-green border-neon-green/30' : 'bg-red-900/30 text-red-400 border-red-500/30'"
                              x-text="hostStatus === 'stopped' ? 'CRITICAL OFFLINE' : 'SYSTEM NOMINAL'"></span>
                    </div>
                </div>
                
                <div class="flex gap-4 md:gap-8" x-show="hostStatus === 'running'">
                    <div class="flex flex-col items-center">
                        <div class="dial w-16 h-16 md:w-20 md:h-20 bg-black mb-2 shadow-lg" :style="getDialGradient(hostCpu, getCpuColor(hostCpu, hostCpuThresh))">
                            <span class="relative z-10 text-sm md:text-base font-mono font-bold text-white drop-shadow-md" x-text="Math.round(hostCpu) + '%'"></span>
                        </div>
                        <span class="text-[9px] md:text-[10px] font-black text-zinc-500 tracking-widest uppercase">CPU</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="dial w-16 h-16 md:w-20 md:h-20 bg-black mb-2 shadow-lg" :style="getDialGradient((hostMemUsed / Math.max(hostMemTotal, 1)) * 100, getRamColor((hostMemUsed / Math.max(hostMemTotal, 1)) * 100, hostMemThresh))">
                            <span class="relative z-10 text-xs md:text-sm font-mono font-bold text-white drop-shadow-md" x-text="hostMemUsed.toFixed(1) + 'G'"></span>
                        </div>
                        <span class="text-[9px] md:text-[10px] font-black text-zinc-500 tracking-widest uppercase">RAM</span>
                    </div>
                </div>
            </div>

            <div class="xl:col-span-3 glass-panel rounded-xl p-5 flex justify-between items-center relative overflow-hidden min-h-[120px]" :class="piholeActive ? '' : 'border-amber-500/50 bg-amber-950/30'">
                <div class="flex flex-col justify-between h-full z-10">
                    <div>
                        <h2 class="text-xs font-black text-zinc-500 tracking-widest uppercase">DNS Sinkhole</h2>
                        <div class="text-xl md:text-2xl font-black font-mono mt-1" :class="piholeActive ? 'text-neon-green' : 'text-amber-500'" x-text="piholeActive ? 'ACTIVE' : 'DEGRADED'"></div>
                    </div>
                    <div class="mt-auto font-mono text-sm space-y-1 pt-2">
                        <div class="text-zinc-500 text-[10px] uppercase font-black tracking-widest">Total: <span class="text-white text-xs" x-text="(pihole.queries_today || 0).toLocaleString()"></span></div>
                        <div class="text-zinc-500 text-[10px] uppercase font-black tracking-widest">Blocks: <span class="text-neon-green text-xs" x-text="(pihole.ads_blocked || 0).toLocaleString()"></span></div>
                    </div>
                </div>
                <div class="dial w-16 h-16 md:w-20 md:h-20 bg-black shadow-inner z-10 shrink-0 ml-4" :style="getDialGradient(pihole.ads_percentage || 0, '#39ff14')">
                    <div class="relative z-10 flex flex-col items-center justify-center">
                        <span class="text-sm md:text-lg font-black font-mono text-white leading-none drop-shadow-md" x-text="Math.round(pihole.ads_percentage || 0) + '%'"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- INFRASTRUCTURE BENTO-GRID -->
        <div class="flex-1 flex flex-col gap-6 min-h-0">
            <template x-for="category in categories" :key="category.id">
                <div x-show="getFiltered(category.filter).length > 0" class="flex flex-col">
                    <h3 class="text-[10px] font-black text-zinc-600 uppercase tracking-[0.25em] mb-3 border-b border-zinc-800/50 pb-2" x-text="category.title"></h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-6 2xl:grid-cols-8 gap-4">
                        <template x-for="t in getFiltered(category.filter)" :key="t.entity_name">
                            <div class="glass-panel rounded-xl p-4 flex flex-col justify-between transition-all min-h-[150px] relative overflow-hidden"
                                 :class="{
                                    'status-paused': t.is_enabled === 0,
                                    'status-pulse-red bg-red-950/40': t.status === 'stopped' && t.is_enabled === 1
                                 }">
                                
                                <div class="flex justify-between items-start mb-1 z-10">
                                    <div class="truncate w-full">
                                        <h4 class="font-black text-white text-base uppercase tracking-wider truncate drop-shadow" x-text="t.entity_name"></h4>
                                        <div class="flex items-center gap-1.5 mt-0.5">
                                            <div class="text-[9px] font-mono font-black tracking-widest uppercase px-1.5 py-0.5 rounded inline-block border"
                                                 :class="t.status === 'running' ? 'bg-[#39ff14]/10 text-neon-green border-neon-green/30' : 'bg-red-900/30 text-red-400 border-red-500/30'"
                                                 x-text="t.is_enabled === 0 ? 'PAUSED' : (t.status === 'stopped' ? 'OFFLINE' : 'ONLINE')"></div>
                                            <div class="text-[8px] font-mono font-bold text-zinc-400 uppercase tracking-widest px-1.5 py-0.5 rounded bg-black/50 border border-zinc-700/50" x-text="t.location || 'LOCAL'"></div>
                                        </div>
                                    </div>
                                </div>

                                <div x-show="t.status === 'stopped' && t.is_enabled === 1" class="flex-1 flex flex-col justify-center items-center bg-red-950/50 rounded-lg border border-red-500/30 mt-2 p-2 z-10">
                                    <div class="text-red-500 text-[10px] font-black uppercase tracking-widest mb-1">Failure</div>
                                    <div class="text-red-300 font-mono text-sm font-bold" x-text="formatTime(t.down_since)"></div>
                                </div>

                                <div x-show="t.status === 'running' && t.is_enabled === 1" class="flex justify-around items-end flex-1 pb-1 pt-2 z-10">
                                    
                                    <template x-if="['host', 'vm', 'lxc', 'game'].includes(t.entity_type)">
                                        <div class="flex flex-col items-center">
                                            <div class="dial w-12 h-12 bg-black mb-1 shadow-lg" :style="getDialGradient(t.cpu_usage || 0, getCpuColor(t.cpu_usage, t.cpu_threshold))">
                                                <span class="relative z-10 text-xs font-mono font-bold text-white drop-shadow-md" x-text="Math.round(t.cpu_usage || 0) + '%'"></span>
                                            </div>
                                            <span class="text-[9px] font-black text-zinc-500 tracking-widest uppercase">CPU</span>
                                        </div>
                                    </template>

                                    <template x-if="['host', 'vm', 'lxc', 'game'].includes(t.entity_type)">
                                        <div class="flex flex-col items-center">
                                            <div class="dial w-12 h-12 bg-black mb-1 shadow-lg" :style="getDialGradient((t.mem_used / Math.max(t.mem_total, 1)) * 100, getRamColor((t.mem_used / Math.max(t.mem_total, 1)) * 100, t.mem_threshold))">
                                                <span class="relative z-10 text-[10px] font-mono font-bold text-white drop-shadow-md" x-text="(t.mem_used || 0).toFixed(1) + 'G'"></span>
                                            </div>
                                            <span class="text-[9px] font-black text-zinc-500 tracking-widest uppercase">RAM</span>
                                        </div>
                                    </template>

                                    <template x-if="t.entity_type === 'storage'">
                                        <div class="w-full flex flex-col justify-end h-full px-1">
                                            <div class="flex justify-between items-end text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-1.5">
                                                <span>Usage</span>
                                                <span class="text-lg font-mono leading-none" :style="`color: ${getRamColor((t.disk_used / Math.max(t.disk_total, 1)) * 100, t.mem_threshold)}`" x-text="((t.disk_used / Math.max(t.disk_total, 1)) * 100).toFixed(1) + '%'"></span>
                                            </div>
                                            <div class="w-full bg-black/60 rounded-full h-2.5 overflow-hidden border border-zinc-800 shadow-inner">
                                                <div class="h-full rounded-full transition-all duration-1000 shadow-[0_0_10px_rgba(255,255,255,0.2)]" 
                                                     :style="`width: ${(t.disk_used / Math.max(t.disk_total, 1)) * 100}%; background: ${getRamColor((t.disk_used / Math.max(t.disk_total, 1)) * 100, t.mem_threshold)}`"></div>
                                            </div>
                                            <div class="text-[9px] text-right font-mono font-bold text-zinc-400 mt-1.5" x-text="formatStorage(t.disk_used) + ' / ' + formatStorage(t.disk_total)"></div>
                                        </div>
                                    </template>

                                    <template x-if="t.entity_type === 'network'">
                                        <div class="w-full bg-black/60 rounded py-2 border border-zinc-800/50 flex flex-col items-center justify-center h-full shadow-inner">
                                            <span class="text-[9px] font-black text-zinc-500 uppercase tracking-widest mb-1">Latency</span>
                                            <span class="text-xl font-mono font-black text-neon-green drop-shadow" x-text="(t.ping_ms || 0).toFixed(0) + 'ms'"></span>
                                        </div>
                                    </template>

                                    <template x-if="t.entity_type === 'app'">
                                        <div class="w-full bg-black/60 rounded py-2 border border-zinc-800/50 flex flex-col items-center justify-center h-full shadow-inner">
                                            <span class="text-[9px] font-black text-zinc-500 uppercase tracking-widest mb-1">TCP Port</span>
                                            <span class="text-sm font-mono font-black text-neon-purple uppercase tracking-widest">ACTIVE</span>
                                        </div>
                                    </template>
                                </div>
                                
                                <!-- Background Sparkline (10m History) -->
                                <div x-show="t.status === 'running' && t.is_enabled === 1 && getSparklinePoints(t)" class="absolute bottom-0 left-0 w-full h-12 opacity-30 pointer-events-none z-0">
                                    <svg class="w-full h-full" viewBox="0 0 100 30" preserveAspectRatio="none">
                                        <polyline fill="none" :stroke="t.entity_type === 'network' ? '#39ff14' : '#b026ff'" stroke-width="1.5" :points="getSparklinePoints(t)"></polyline>
                                    </svg>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
        function initScaler() {
            const wrapper = document.getElementById('noc-wrapper');
            const scaleApp = () => {
                if (window.innerWidth >= 1280) { 
                    document.body.style.overflow = 'hidden';
                    wrapper.style.position = 'absolute';
                    wrapper.style.width = '1920px';
                    wrapper.style.height = '1080px';
                    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
                    wrapper.style.transform = `scale(${scale})`;
                    wrapper.style.left = `${(window.innerWidth - (1920 * scale)) / 2}px`;
                    wrapper.style.top = `${(window.innerHeight - (1080 * scale)) / 2}px`;
                } else { 
                    document.body.style.overflow = 'auto';
                    wrapper.style.position = 'relative';
                    wrapper.style.width = '100%';
                    wrapper.style.height = 'auto';
                    wrapper.style.transform = 'none';
                    wrapper.style.left = '0';
                    wrapper.style.top = '0';
                }
            };
            window.addEventListener('resize', scaleApp);
            scaleApp();
        }
        document.addEventListener("DOMContentLoaded", initScaler);

        function nocApp() {
            return {
                targets: [],
                sparklines: {},
                pihole: {},
                piholeActive: false,
                sysTime: '--:--:--',
                isMuted: false,
                wanPing: 0,
                wanStatus: 'stopped',
                
                hostStatus: 'stopped',
                hostCpu: 0,
                hostMemUsed: 0,
                hostMemTotal: 1,
                hostCpuThresh: 90.0,
                hostMemThresh: 90.0,

                chartObj: null,

                categories: [
                    { id: 'proxmox', title: 'Virtualization & Hypervisor', filter: ['vm', 'lxc'] },
                    { id: 'storage', title: 'Data Stores & NAS', filter: ['storage'] },
                    { id: 'games', title: 'Pterodactyl Game Engines', filter: ['game'] },
                    { id: 'services', title: 'Core Applications & Network', filter: ['network', 'app'] }
                ],

                initApp() {
                    const updateTime = () => { this.sysTime = new Date().toLocaleTimeString('en-US', { hour12: false }); };
                    updateTime(); 
                    setInterval(updateTime, 1000);

                    const ctx = document.getElementById('wanChart').getContext('2d');
                    this.chartObj = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: Array(60).fill(''),
                            datasets: [{
                                data: Array(60).fill(0),
                                borderColor: '#39ff14', 
                                backgroundColor: 'rgba(57, 255, 20, 0.15)',
                                borderWidth: 2, fill: true, tension: 0.3, pointRadius: 0
                            }]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: { legend: { display: false }, tooltip: { enabled: false } },
                            scales: { x: { display: false }, y: { display: false, min: 0, suggestedMax: 50 } },
                            animation: { duration: 0 }
                        }
                    });

                    this.fetchData();
                    setInterval(() => this.fetchData(), 10000);
                },

                async fetchData() {
                    try {
                        const res = await fetch('/api/live');
                        const json = await res.json();
                        if (json.status === 'success') {
                            this.targets = json.data;
                            this.sparklines = json.sparklines || {};
                            this.pihole = json.pihole || {};
                            
                            const ps = (this.pihole.status || '').toLowerCase();
                            this.piholeActive = ['enabled', 'active', 'blocking'].includes(ps) || (this.pihole.queries_today > 0);
                            this.isMuted = (json.settings && json.settings.global_mute === '1');

                            const host = this.targets.find(t => t.entity_name === 'CORE-PVE');
                            if (host) {
                                this.hostStatus = host.status;
                                this.hostCpu = host.cpu_usage || 0;
                                this.hostMemUsed = host.mem_used || 0;
                                this.hostMemTotal = host.mem_total || 1;
                                this.hostCpuThresh = host.cpu_threshold || 90.0;
                                this.hostMemThresh = host.mem_threshold || 90.0;
                            }

                            const wan = this.targets.find(t => t.entity_name === 'WAN_DNS');
                            if (wan) {
                                this.wanPing = (wan.ping_ms || 0).toFixed(0);
                                this.wanStatus = wan.status;
                            }
                            
                            if (json.wan_history && json.wan_history.length > 0) {
                                const padded = [...Array(Math.max(0, 60 - json.wan_history.length)).fill(0), ...json.wan_history];
                                this.chartObj.data.datasets[0].data = padded;
                                this.chartObj.data.datasets[0].borderColor = this.wanStatus === 'running' ? '#39ff14' : '#ef4444';
                                this.chartObj.data.datasets[0].backgroundColor = this.wanStatus === 'running' ? 'rgba(57, 255, 20, 0.15)' : 'rgba(239, 68, 68, 0.15)';
                                this.chartObj.update();
                            }
                        }
                    } catch (e) {}
                },

                getFiltered(types) {
                    return this.targets.filter(t => types.includes(t.entity_type) && !['WAN_DNS', 'CORE-PVE'].includes(t.entity_name));
                },

                getSparklinePoints(t) {
                    const key = t.entity_name + '_' + t.entity_type;
                    const dataObj = this.sparklines[key];
                    if (!dataObj) return '';
                    const data = t.entity_type === 'network' ? dataObj.ping : dataObj.cpu;
                    if (!data || data.length === 0) return '';
                    
                    const max = Math.max(...data, 10);
                    return data.map((val, i) => {
                        const x = (i / Math.max(data.length - 1, 1)) * 100;
                        const y = 30 - ((val / max) * 28);
                        return `${x.toFixed(1)},${y.toFixed(1)}`;
                    }).join(' ');
                },

                formatStorage(gb) {
                    if (!gb) return '0G';
                    if (gb >= 1000) return (gb / 1024).toFixed(2) + 'T';
                    return gb.toFixed(1) + 'G';
                },

                getCpuColor(val, threshold = 90.0) {
                    if (val >= threshold) return '#ef4444'; 
                    if (val >= (threshold * 0.8)) return '#f59e0b'; 
                    return '#39ff14'; 
                },
                
                getRamColor(val, threshold = 90.0) {
                    if (val >= threshold) return '#ef4444'; 
                    if (val >= (threshold * 0.8)) return '#f59e0b'; 
                    return '#b026ff'; 
                },

                getDialGradient(percent, color) {
                    const p = Math.max(0, Math.min(percent || 0, 100));
                    return `background: conic-gradient(${color} ${p}%, rgba(0, 0, 0, 1) ${p}%);`;
                },

                formatTime(timestamp) {
                    if (!timestamp) return 'Unknown';
                    const diff = Math.floor(Date.now() / 1000) - timestamp;
                    const h = Math.floor(diff / 3600);
                    const m = Math.floor((diff % 3600) / 60);
                    if (h > 24) return Math.floor(h/24) + 'd ' + (h%24) + 'h';
                    return (h > 0 ? h + 'h ' : '') + m + 'm';
                }
            }
        }
    </script>
</body>
</html>
