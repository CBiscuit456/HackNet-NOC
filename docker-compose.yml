version: '3.8'

services:
  # The FastAPI Backend & Static File Server
  noc-api:
    build: .
    container_name: hacknet-noc-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DB_NAME=/app/data/metrics.db
    command: uvicorn api:app --host 0.0.0.0 --port 8000

  # The Background Polling Engine
  noc-collector:
    build: .
    container_name: hacknet-noc-collector
    restart: always
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DB_NAME=/app/data/metrics.db
    command: python collector.py
    depends_on:
      - noc-api

      