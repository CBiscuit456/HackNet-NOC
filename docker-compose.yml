services:
  noc-api:
    build: .
    container_name: hacknet-noc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DB_NAME=/app/data/metrics.db
      - TZ=Etc/UTC
    command: uvicorn api:app --host 0.0.0.0 --port 8000

  noc-collector:
    build: .
    container_name: hacknet-noc-collector
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DB_NAME=/app/data/metrics.db
      - TZ=Etc/UTC
    command: python collector.py
    depends_on:
      - noc-api

      

      
      
      